server:
  port: 8080

spring:
  application:
    name: yujian-gateway
  profiles:
    active: test
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: yujian-admin
          uri: lb://yujian-admin
          predicates:
            - Path=/admin/**
          filters:
            - StripPrefix=1
        - id: yujian-api
          uri: lb://yujian-api
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=1

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: info
