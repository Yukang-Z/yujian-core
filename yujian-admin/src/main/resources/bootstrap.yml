# Nacos 必须放在 bootstrap，保证配置中心优先于 application.yml 加载
# Data ID 默认：${spring.application.name}.yml （如 yujian-admin.yml）
spring:
  application:
    name: yujian-admin
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
        namespace: ${nacos.namespace:}
        group: DEFAULT_GROUP
      config:
        server-addr: ${spring.cloud.nacos.server-addr}
        namespace: ${nacos.namespace:}
        group: DEFAULT_GROUP
        file-extension: yml
        # 发布公共配置后可打开：
        # shared-configs:
        #   - data-id: yujian-common.yml
        #     group: DEFAULT_GROUP
        #     refresh: true

# 留空使用 public；生产填写 Nacos 命名空间 ID
nacos:
  namespace:
